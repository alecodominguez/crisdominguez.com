<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <style>
        body {
            /* Centers the content vertically and horizontally */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            font-family: sans-serif;
        }
        .image-container {
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        img {
            /* Ensures the image doesn't overflow its container on small screens */
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <!-- The src attribute must match your uploaded filename exactly -->
        <img src="IMG-20190929-WA0008.jpg" alt="Child wearing a school uniform jacket[span_0](start_span)[span_0](end_span)">
    </div>

</body>
</html>
